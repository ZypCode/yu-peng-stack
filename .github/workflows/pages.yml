name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 旧 master 分支是纯静态站；改写路径后作为临时发布源（Hexo 3.8 在 CI 上生成空文件，待修复后再切回 npx hexo generate）
      - uses: actions/checkout@v4
        with:
          repository: ZypCode/ZypCode.github.io
          ref: master
          path: legacy-site

      - name: Rewrite paths for project site
        run: |
          chmod +x scripts/prepare-legacy-static.sh
          ./scripts/prepare-legacy-static.sh legacy-site out
          find out -name 'index.html' -exec wc -c {} \; | head -5

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4